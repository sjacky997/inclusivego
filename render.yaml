services:
  - type: web
    name: inclusivego
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py --port $PORT
    envVars:
      - key: IG_NO_BROWSER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.6"
    autoDeploy: true
